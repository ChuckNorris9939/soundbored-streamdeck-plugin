name: Build and Release Stream Deck Plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build plugin bundle
        run: npm run build

      - name: Validate and pack Stream Deck plugin
        run: |
          mkdir -p dist
          npx @elgato/cli validate com.soundbored.streamdeck.sdPlugin
          npx @elgato/cli pack com.soundbored.streamdeck.sdPlugin --output dist --force
          zip -r dist/com.soundbored.streamdeck.sdPlugin.zip com.soundbored.streamdeck.sdPlugin -x "*.sdPlugin/logs/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: com.soundbored.streamdeck
          path: |
            dist/*.streamDeckPlugin
            dist/*.zip

      - name: Publish or update Latest Release (on push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.streamDeckPlugin dist/*.zip \
            --title "Latest Build" \
            --notes "Automated build from commit ${{ github.sha }}. Download and double-click **com.soundbored.streamdeck.streamDeckPlugin** to install directly into the Elgato Stream Deck app, or extract **com.soundbored.streamdeck.sdPlugin.zip** into your Stream Deck Plugins directory."

      - name: Publish Versioned Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" dist/*.streamDeckPlugin dist/*.zip \
            --title "$TAG_NAME" \
            --generate-notes
